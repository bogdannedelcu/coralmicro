<!DOCTYPE html><html><head><meta charset="UTF-8"><title>SentAI</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font:17px/1.5 system-ui,sans-serif;background:#f5f5f5;color:#111;height:100vh;display:flex;flex-direction:column}
#bar{background:#e8e8e8;border-bottom:1px solid #ccc;padding:6px 10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#bc{flex:1;font-size:16px;color:#333}
#bc b{cursor:pointer;font-weight:normal}#bc b:hover{color:#0055aa;text-decoration:underline}
button{background:#fff;color:#111;border:1px solid #aaa;padding:4px 14px;cursor:pointer;font:inherit;border-radius:3px}
button:hover{background:#0055aa;color:#fff;border-color:#0055aa}
#wrap{display:flex;flex:1;overflow:hidden}
#left{width:520px;min-width:120px;overflow-y:auto;background:#fff;flex-shrink:0}
#rsz{width:6px;background:#ddd;cursor:col-resize;flex-shrink:0;transition:background .15s}
#rsz:hover,#rsz.drag{background:#0055aa}
.f{padding:5px 10px;cursor:pointer;display:flex;gap:6px;align-items:center;border-bottom:1px solid #eee}
.f:hover{background:#e8f0ff}.f.sel{background:#ddeeff;border-left:3px solid #0055aa}
.f i{width:18px;font-style:normal;text-align:center;color:#888}
.f b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:normal}
.f s{color:#999;font-size:13px;text-decoration:none;white-space:nowrap;flex-shrink:0}
#right{flex:1;display:flex;flex-direction:column;overflow:hidden}
#rbar{background:#e8e8e8;border-bottom:1px solid #ccc;padding:5px 10px;display:flex;gap:6px;align-items:center;display:none}
#rp{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:15px;color:#444}
#view{flex:1;overflow:auto;background:#fff}
textarea{width:100%;height:100%;background:#fff;color:#111;border:0;padding:10px;font:16px/1.6 Consolas,'Courier New',monospace;resize:none;outline:0;tab-size:4}
img.p{max-width:100%;max-height:100%;display:block;margin:16px auto}
#st{background:#e8e8e8;border-top:1px solid #ccc;color:#555;padding:3px 10px;font-size:14px}
</style></head><body>
<div id="bar"><span style="font-weight:700;color:#0055aa;font-size:17px;margin-right:4px;white-space:nowrap">SentAI</span><span id="bc">/</span>
<button onclick="doUpload()">Upload</button>
<button onclick="doNewFile()">New File</button>
<button onclick="doMkdir()">Mkdir</button>
<button onclick="go(cwd)">Refresh</button></div>
<div id="wrap"><div id="left"></div><div id="rsz"></div>
<div id="right"><div id="rbar"><span id="rp"></span>
<button id="bsv" onclick="doSave()" style="display:none">Save</button>
<button onclick="doDel()">Del</button>
<button id="bdl" onclick="doDl(sel)" style="display:none">DL</button></div>
<div id="view"></div></div></div>
<div id="pgbar" style="display:none;position:fixed;bottom:32px;left:50%;transform:translateX(-50%);background:#222;color:#eee;padding:10px 20px;border-radius:7px;font-size:13px;z-index:999;min-width:200px;text-align:center"><div id="pgbtxt"></div><div style="height:5px;background:#444;margin-top:7px"><div id="pgbfill" style="height:100%;background:#4af;width:0%"></div></div></div>
<div id="st">Ready</div>
<input type="file" id="fi" style="display:none" multiple onchange="upFiles(this.files)">
<script>
var cwd='/',sel=null,ed=false,dirty=false;
var $=function(i){return document.getElementById(i)};
function st(m){$('st').textContent=m}
function sz(b){return b<1024?b+'B':b<1048576?(b/1024).toFixed(1)+'K':(b/1048576).toFixed(1)+'M'}
function pj(d,n){return d=='/'?'/'+n:d+'/'+n}
function up(p){if(p=='/')return'/';var i=p.lastIndexOf('/');return i<=0?'/':p.substring(0,i)}
function ext(n){var i=n.lastIndexOf('.');return i>=0?n.substring(i+1).toLowerCase():''}
function isTxt(n){return'py txt json csv md log cfg ini html js xml yaml sh c h cc cpp conf lua rb go rs toml cmake'.split(' ').indexOf(ext(n))>=0}
function isImg(n){return'jpg jpeg png gif bmp webp svg'.split(' ').indexOf(ext(n))>=0}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function bc(path){
  var el=$('bc');el.innerHTML='';
  var parts=path.split('/').filter(Boolean),acc='';
  var r=document.createElement('b');r.textContent='/';r.onclick=function(){go('/')};el.appendChild(r);
  parts.forEach(function(p){acc+='/'+p;var s=document.createElement('b');s.textContent=' '+p+' /';var t=acc;s.onclick=function(){go(t)};el.appendChild(s)});
}

function go(path,_retry){
  if(!_retry&&dirty&&!confirm('Discard changes?'))return;
  if(!_retry){sel=null;ed=false;dirty=false;$('rbar').style.display='none';$('view').innerHTML='';}
  cwd=path;bc(path);
  st(_retry?'Retrying...':'Loading...');
  var u=path=='/'?'/api/ls':'/api/ls'+path;
  fetch(u).then(function(r){return r.json()}).then(function(files){
    if(files&&files.error==='lfs_busy'){st('LFS busy, retrying...');setTimeout(function(){go(path,true)},600);return}
    files=files.filter(function(f){return f.name[0]!='.'});
    files.sort(function(a,b){return a.type!=b.type?(a.type=='dir'?-1:1):a.name.localeCompare(b.name)});
    var L=$('left');L.innerHTML='';
    if(path!='/'){var d=document.createElement('div');d.className='f';d.innerHTML='<i>^</i><b>..</b>';d.onclick=function(){go(up(path))};L.appendChild(d)}
    files.forEach(function(f){
      var d=document.createElement('div');d.className='f';
      var ic=f.type=='dir'?'D':(isImg(f.name)?'I':'F');
      d.innerHTML='<i>'+ic+'</i><b>'+esc(f.name)+(f.type=='dir'?'/':'')+'</b>'+(f.type!='dir'?'<s>'+sz(f.size)+'</s>':'');
      d.onclick=function(){
        if(f.type=='dir'){go(pj(path,f.name))}
        else{L.querySelectorAll('.f').forEach(function(e){e.classList.remove('sel')});d.classList.add('sel');open(pj(path,f.name),f)}
      };L.appendChild(d)});
    st(files.length+' items');
  }).catch(function(e){st('Error: '+e.message)});
}

function rawBusy(data){var s=new TextDecoder('utf-8',{fatal:false}).decode(data.slice(0,30));return s.indexOf('{"error":"lfs_busy"}')===0}
function open(path,info,_retry){
  if(!_retry&&dirty&&!confirm('Discard changes?'))return;
  sel=path;dirty=false;
  $('rbar').style.display='flex';$('rp').textContent=path;
  $('bdl').style.display='inline';
  var name=path.split('/').pop(),V=$('view'),S=$('bsv');
  if(info.size>51200){V.innerHTML='<div style="padding:40px;text-align:center">'+sz(info.size)+'<br>Use DL</div>';S.style.display='none';ed=false;st(name);return}
  if(isTxt(name)){
    st(_retry?'Retrying...':'Loading...');S.style.display='inline';ed=true;
    V.innerHTML='<div style="padding:40px;text-align:center;color:#aaa;font-size:15px">Loading '+esc(name)+'...</div>';
    var pg=$('pgbar'),fill=$('pgbfill'),txt=$('pgbtxt');
    pg.style.display='block';fill.style.width='0%';txt.textContent='Loading '+name+'...';
    fetch('/api/raw'+path).then(function(r){
      var total=parseInt(r.headers.get('Content-Length')||'0'),recv=0,chunks=[];
      var reader=r.body.getReader();
      function rd(){return reader.read().then(function(d){
        if(d.done){
          pg.style.display='none';
          var all=new Uint8Array(recv),off=0;
          chunks.forEach(function(c){all.set(c,off);off+=c.length});
          if(rawBusy(all)){st('LFS busy, retrying...');setTimeout(function(){open(path,info,true)},600);return}
          var t=new TextDecoder('utf-8',{fatal:false}).decode(all);
          V.innerHTML='<textarea id="ed"></textarea>';var e=$('ed');e.value=t;
          e.oninput=function(){dirty=true};
          e.onkeydown=function(ev){if(ev.key=='Tab'){ev.preventDefault();var s=e.selectionStart;e.value=e.value.substring(0,s)+'    '+e.value.substring(e.selectionEnd);e.selectionStart=e.selectionEnd=s+4;dirty=true}};
          st('Editing '+name+' ('+sz(recv)+')');
          return;
        }
        chunks.push(d.value);recv+=d.value.length;
        if(total>0){var p=Math.round(recv/total*100);fill.style.width=p+'%';txt.textContent=name+' — '+sz(recv)+' / '+sz(total)+' ('+p+'%)'}
        else{txt.textContent=name+' — '+sz(recv)+' received'};
        return rd();
      })}
      return rd();
    }).catch(function(e){pg.style.display='none';V.innerHTML='<div style="padding:20px;color:#c44">Error: '+esc(e.message)+'</div>';st('Error')});
  } else if(isImg(name)){
    st('Loading '+name+'...');
    V.innerHTML='<div style="padding:40px;text-align:center;color:#aaa;font-size:15px">Loading...</div>';
    S.style.display='none';ed=false;
    var pg=$('pgbar'),fill=$('pgbfill'),txt=$('pgbtxt');
    pg.style.display='block';fill.style.width='0%';txt.textContent='Loading '+name+'...';
    fetch('/api/raw'+path).then(function(r){
      var total=parseInt(r.headers.get('Content-Length')||'0'),recv=0,chunks=[];
      var reader=r.body.getReader();
      function rd(){return reader.read().then(function(d){
        if(d.done){
          pg.style.display='none';
          var all=new Uint8Array(recv),off=0;
          chunks.forEach(function(c){all.set(c,off);off+=c.length});
          if(rawBusy(all)){st('LFS busy, retrying...');setTimeout(function(){open(path,info,true)},600);return}
          var blob=new Blob(chunks),url=URL.createObjectURL(blob);
          var im=new Image();im.className='p';
          im.onload=function(){V.innerHTML='';V.appendChild(im);URL.revokeObjectURL(url);st(name+' ('+sz(recv)+')')};
          im.onerror=function(){V.innerHTML='<div style="padding:20px;color:#c44">Image decode error ('+sz(recv)+')</div>';URL.revokeObjectURL(url);st('Error')};
          im.src=url;return;
        }
        chunks.push(d.value);recv+=d.value.length;
        if(total>0){var p=Math.round(recv/total*100);fill.style.width=p+'%';txt.textContent=name+' — '+sz(recv)+' / '+sz(total)+' ('+p+'%)'}
        else{txt.textContent=name+' — '+sz(recv)+' received'};
        return rd();
      })}
      return rd();
    }).catch(function(e){pg.style.display='none';V.innerHTML='<div style="padding:20px;color:#c44">Error: '+esc(e.message)+'</div>';st('Error')});
  } else {
    V.innerHTML='<div style="padding:20px;color:#888;text-align:center"><p>'+esc(name)+'</p><p>'+sz(info.size)+'</p></div>';
    S.style.display='none';ed=false;st(name+' '+sz(info.size));
  }
}

function doSave(){if(!sel||!ed)return;var c=$('ed').value;st('Saving...');var b=$('bsv');
  fetch('/api/write'+sel,{method:'POST',body:c}).then(function(r){return r.text()}).then(function(t){var j=JSON.parse(t);if(j.ok){st('Saved OK ('+sz(j.size||c.length)+')');dirty=false;b.style.background='#0a0';b.textContent='OK';setTimeout(function(){b.style.background='';b.textContent='Save'},1500)}else st('Err: '+j.error)})}
function doDel(){if(!sel||!confirm('Delete '+sel+'?'))return;st('Deleting...');
  fetch('/api/rm'+sel,{method:'POST'}).then(function(r){return r.text()}).then(function(t){var j=JSON.parse(t);if(j.ok){st('Deleted');sel=null;ed=false;dirty=false;$('rbar').style.display='none';$('view').innerHTML='';go(cwd)}else st('Err: '+j.error)})}
function doDl(path){if(!path)return;var name=path.split('/').pop(),pg=$('pgbar'),fill=$('pgbfill'),txt=$('pgbtxt');pg.style.display='block';fill.style.width='0%';txt.textContent='Connecting...';
fetch('/api/raw'+path).then(function(r){var total=parseInt(r.headers.get('Content-Length')||'0'),recv=0,chunks=[];
var reader=r.body.getReader();
function rd(){return reader.read().then(function(d){if(d.done){
var all=new Uint8Array(recv),ci=0;chunks.forEach(function(c){all.set(c,ci);ci+=c.length});
if(rawBusy(all)){st('LFS busy, retrying DL...');setTimeout(function(){doDl(path)},600);return}
var blob=new Blob([all]),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();document.body.removeChild(a);setTimeout(function(){URL.revokeObjectURL(url)},2000);pg.style.display='none';st('Downloaded '+name+' ('+sz(recv)+')');return}chunks.push(d.value);recv+=d.value.length;if(total>0){var p=Math.round(recv/total*100);fill.style.width=p+'%';txt.textContent=name+' — '+sz(recv)+' / '+sz(total)+' ('+p+'%)'}else{txt.textContent=name+' — '+sz(recv)+' received'};return rd()})}
return rd()}).catch(function(e){pg.style.display='none';st('DL error: '+e.message)})}
function doUpload(){$('fi').click()}
function upFiles(files){var i=0;function nx(){if(i>=files.length){$('fi').value='';go(cwd);return}var f=files[i++];st('Upload '+f.name+'...');
  f.arrayBuffer().then(function(b){return fetch('/api/write'+pj(cwd,f.name),{method:'POST',body:b})}).then(function(r){return r.text()}).then(function(){nx()})}nx()}
function doMkdir(){var n=prompt('Name:');if(!n)return;st('Creating...');
  fetch('/api/mkdir'+pj(cwd,n.trim()),{method:'POST'}).then(function(r){return r.text()}).then(function(t){var j=JSON.parse(t);if(j.ok)go(cwd);else st('Err: '+j.error)})}
function doNewFile(){var n=prompt('New file name:');if(!n)return;n=n.trim();if(!n)return;
  var p=pj(cwd,n);st('Creating '+n+'...');
  fetch('/api/write'+p,{method:'POST',body:''}).then(function(r){return r.text()}).then(function(t){
    var j=JSON.parse(t);if(!j.ok){st('Err: '+(j.error||'?'));return}
    go(cwd);setTimeout(function(){
      var L=$('left'),items=L.querySelectorAll('.f');
      for(var i=0;i<items.length;i++){if(items[i].querySelector('b')&&items[i].querySelector('b').textContent===n){items[i].click();break}}
    },300);
  })}
document.onkeydown=function(e){if((e.ctrlKey||e.metaKey)&&e.key=='s'){e.preventDefault();doSave()}};
(function(){var rsz=$('rsz'),lp=$('left'),drag=false,sx,sw;
rsz.onmousedown=function(e){drag=true;sx=e.clientX;sw=lp.offsetWidth;rsz.classList.add('drag');e.preventDefault()};
document.onmousemove=function(e){if(!drag)return;var w=sw+(e.clientX-sx);lp.style.width=Math.max(120,Math.min(w,window.innerWidth*0.6))+'px'};
document.onmouseup=function(){if(drag){drag=false;rsz.classList.remove('drag')}}})();
go('/');
</script>
</body>
</html>
