syntax = "proto3";

package visionmesh;

// GPS coordinate pair (degrees × 1e7 for integer precision)
message GpsCoord {
  sfixed32 lat_e7 = 1;  // latitude  × 1e7  (e.g. 44.4268° → 444268000)
  sfixed32 lon_e7 = 2;  // longitude × 1e7  (e.g. 26.1025° → 261025000)
}

// Static camera configuration (sent once when changed, e.g. camera switch).
// Receiver caches the last received config per sensor_id.
// Used to reconstruct footprint corners and target GPS from ground coords.
message SensorConfig {
  uint32 camera_id      = 1;  // which camera (0 or 1)
  uint32 fov_h_e1       = 2;  // horizontal FOV × 10 (e.g. 708 = 70.8°)
  uint32 fov_v_e1       = 3;  // vertical FOV × 10 (e.g. 434 = 43.4°)
  sint32 mount_pitch_e1 = 4;  // mount pitch × 10 (0 = down, 250 = 25.0°)
  sint32 mount_roll_e1  = 5;  // mount roll × 10 (0 = landscape)
  sint32 mount_yaw_e1   = 6;  // mount yaw × 10 (0 = forward)
  uint32 ground_ref     = 7;  // bbox anchor: 0=centroid (drone), 1=bottom (pole)
}

// Dynamic camera pose at capture time (sent only when changed).
// Receiver caches the last received pose per sensor_id.
// Receiver reconstructs from pose + config:
//   - footprint corners (camera_gps + altitude + heading + FOV + mount angles)
//   - target GPS (camera_gps + heading + gx_cm/gy_cm rotation)
//   - distance to target: sqrt(gx_cm² + gy_cm²)
message SensorPose {
  sint32 pitch_deg    = 1;  // board pitch from IMU (-90..+90)
  sint32 roll_deg     = 2;  // board roll from IMU (-180..+180)
  uint32 altitude_cm  = 3;  // camera height above ground, cm
  uint32 heading_deg  = 4;  // compass heading (0..359, 0=N 90=E)
  GpsCoord camera_gps = 5;  // camera lat/lon (absent = no GPS)
}

message VisionMessage {
  // Packed header: ver(4) | sensor_id(4) | alarm_type(8)
  //   ver        = hdr & 0xF
  //   sensor_id  = (hdr >> 4) & 0xF
  //   alarm_type = (hdr >> 8) & 0xFF
  uint32 hdr            = 1;
  // field 2 retired (was sensor_id, now packed in hdr)
  uint32 track_id       = 3;  // tracker-assigned ID (unique per sensor)
  // field 4 retired (was alarm_type, now packed in hdr)
  optional uint32 timestamp_utc = 5;  // Unix seconds; absent from drone, present from pole
  uint32 seq            = 6;  // monotonic sequence number per sensor

  SensorPose   pose       = 20;  // optional: sent when IMU/GPS/heading changes
  SensorConfig config     = 21;  // optional: sent when changed (camera switch, etc.)
  string       model_name = 22;  // optional: sent once after load_model (e.g. "yolov8n_coco")

  oneof body {
    NewDetection    new_detection    = 10;
    UpdateDetection update_detection = 11;
    DeleteDetection delete_detection = 12;
  }
}

// First detection of a new confirmed track
message NewDetection {
  fixed32 xywh_packed = 1;  // bbox in model pixels: x,y,w,h each 1 byte
  // Packed detection metadata: conf(8) | class_id(8)
  //   conf     = det_meta & 0xFF
  //   class_id = (det_meta >> 8) & 0xFF
  uint32 det_meta     = 2;
  // fields 3-5 retired (were class_id, embedding, embed_crc8)
  sint32 gx_cm        = 7;  // target ground X (East +, cm from camera)
  sint32 gy_cm        = 8;  // target ground Y (North +, cm from camera)
  uint32 width_cm     = 10; // estimated target width on ground, cm
}

// Periodic update for an existing confirmed track
message UpdateDetection {
  fixed32 xywh_packed = 1;  // bbox in model pixels
  // Packed: conf(8) | age(24)
  //   conf = conf_age & 0xFF
  //   age  = (conf_age >> 8) & 0xFFFFFF
  uint32 conf_age     = 2;
  // field 3 retired (was age, now packed in conf_age)
  sint32 gx_cm        = 7;  // target ground X (East +, cm from camera)
  sint32 gy_cm        = 8;  // target ground Y (North +, cm from camera)
}

// Track removed — target lost or left the frame
// Sent when tracker emits TRACK_EVT_LOST or TRACK_EVT_REMOVED.
// Receivers should remove this track_id from their display/map.
message DeleteDetection {
  uint32 reason       = 1;  // 3 = lost (coasting timeout), 4 = removed (max misses)
  uint32 age          = 2;  // total frames this track lived
  uint32 total_hits   = 3;  // total successful detections over lifetime
  // last_gps removed — receiver: rotate gx/gy by heading + offset from camera_gps
  sint32 last_gx_cm   = 5;  // last ground X (East +, cm from camera)
  sint32 last_gy_cm   = 6;  // last ground Y (North +, cm from camera)
}
