syntax = "proto3";

package visionmesh;

message VisionMessage {
  uint32 app_version   = 1;
  uint32 sensor_id     = 2;
  uint32 track_id      = 3;
  uint32 alarm_type    = 4;
  uint32 timestamp_utc = 5;
  uint32 seq           = 6;
  uint32 node_id       = 7;

  // Camera GPS position (WGS84)
  sint32 latitude_i    = 8;   // lat * 1e7 (deg)
  sint32 longitude_i   = 9;   // lon * 1e7 (deg)
  sint32 altitude_mm   = 10;  // altitude in millimeters (MSL)

  // Camera orientation (centidegrees, 0..36000 for heading, ±18000 for pitch/roll)
  uint32 heading_cd    = 13;  // yaw 0..36000 (0=North, 9000=East)
  sint32 pitch_cd      = 14;  // pitch ±18000
  sint32 roll_cd       = 15;  // roll  ±18000

  oneof body {
    NewDetection    new_detection    = 20;
    UpdateDetection update_detection = 21;
  }
}

message NewDetection {
  fixed32 xywh_packed = 1;  // x,y,w,h each 1 byte packed
  uint32 conf         = 2;  // 0..255
  uint32 class_id     = 3;
  bytes embedding     = 4;  // 64 bytes
  uint32 embed_crc8   = 5;  // 0..255
}

message UpdateDetection {
  fixed32 xywh_packed = 1;  // x,y,w,h each 1 byte packed
  uint32 conf         = 2;
  uint32 age          = 3;
}
