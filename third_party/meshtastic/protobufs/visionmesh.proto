syntax = "proto3";

package visionmesh;

// Camera orientation & position at detection time
message SensorPose {
  sint32 pitch_deg   = 1;  // tilt forward/back from horizon (-90..+90)
  sint32 roll_deg    = 2;  // tilt left/right (-180..+180)
  uint32 altitude_cm = 3;  // camera height above ground, cm
  uint32 heading_deg = 4;  // compass heading (0..359, 0=N 90=E 180=S 270=W)
}

message VisionMessage {
  uint32 app_version   = 1;
  uint32 sensor_id     = 2;
  uint32 track_id      = 3;
  uint32 alarm_type    = 4;
  uint32 timestamp_utc = 5;
  uint32 seq           = 6;
  uint32 node_id       = 7;

  SensorPose pose      = 20;  // camera pose at detection time

  oneof body {
    NewDetection    new_detection    = 10;
    UpdateDetection update_detection = 11;
  }
}

message NewDetection {
  fixed32 xywh_packed = 1;  // x,y,w,h each 1 byte packed
  uint32 conf         = 2;  // 0..255
  uint32 class_id     = 3;
  bytes embedding     = 4;  // 64 bytes
  uint32 embed_crc8   = 5;  // 0..255
}

message UpdateDetection {
  fixed32 xywh_packed = 1;  // x,y,w,h each 1 byte packed
  uint32 conf         = 2;
  uint32 age          = 3;
}
